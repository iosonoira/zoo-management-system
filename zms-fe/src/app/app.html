<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="wordmark" routerLink="/animals" aria-label="Zoo Management System, animals">
    <span class="wordmark-mark" aria-hidden="true"></span>
    <span class="wordmark-short">ZMS</span>
    <span class="wordmark-name">Zoo Management System</span>
  </a>

  <div class="controls">
    <app-role-select />

    <button
      type="button"
      class="theme btn btn-quiet"
      [attr.aria-pressed]="theme() === 'dark'"
      (click)="toggleTheme()"
    >
      <app-icon [name]="theme() === 'dark' ? 'moon' : 'sun'" />
      <span class="visually-hidden">Dark theme</span>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<footer class="footer">
  <p>
    Demo data. Every animal, enclosure and staff name here is fictional. The role switch stands in
    for Keycloak sign-in; the same rules as <code>animal-service</code> apply.
  </p>
</footer>
