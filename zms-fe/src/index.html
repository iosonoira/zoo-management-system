<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zoo Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Animal roster, health status and enclosure transfers for zoo staff.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)">
  <script>
    try {
      var t = localStorage.getItem('zms-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
