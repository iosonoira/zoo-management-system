services:
  postgres-animal:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animal_db}
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy env.example to .env first}
    ports:
      - "5432:5432"
    volumes:
      - animal_data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy env.example to .env first}
      ANIMAL_SERVICE_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?copy env.example to .env first}
      ZOO_TEST_USER_PASSWORD: ${ZOO_TEST_USER_PASSWORD:?copy env.example to .env first}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  animal_data:
