services:
  postgres-animal:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animal_db}
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy env.example to .env first}
    ports:
      - "5432:5432"
    volumes:
      - animal_data:/var/lib/postgresql/data
  postgres-health:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_HEALTH_DB:-health_db}
      POSTGRES_USER: ${POSTGRES_HEALTH_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_HEALTH_PASSWORD:?copy env.example to .env first}
    ports:
      - "5433:5432"
    volumes:
      - health_data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy env.example to .env first}
      ANIMAL_SERVICE_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?copy env.example to .env first}
      HEALTH_SERVICE_CLIENT_SECRET: ${HEALTH_OIDC_CLIENT_SECRET:?copy env.example to .env first}
      ZOO_TEST_USER_PASSWORD: ${ZOO_TEST_USER_PASSWORD:?copy env.example to .env first}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
  # Local dev only; services run on the host and connect to localhost:9092.
  # The official image's default config is a single-node KRaft broker+controller
  # advertising PLAINTEXT://localhost:9092 with topic auto-creation enabled.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_NOTIFICATION_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_NOTIFICATION_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:?copy env.example to .env first}
    ports:
      - "5434:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data

volumes:
  animal_data:
  health_data:
  notification_data:
