%dev.quarkus.http.port=8083

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USERNAME:zoo}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/notification_db
%dev.quarkus.hibernate-orm.database.generation=none
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.flyway.migrate-at-start=true

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true

%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

mp.messaging.incoming.animal-events-in.connector=smallrye-kafka
mp.messaging.incoming.animal-events-in.topic=zoo.animal.events
mp.messaging.incoming.animal-events-in.group.id=notification-service
mp.messaging.incoming.animal-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.animal-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.animal-events-in.dead-letter-queue.topic=zoo.animal.events.dlq
mp.messaging.incoming.animal-events-in.auto.offset.reset=earliest
