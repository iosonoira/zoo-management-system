name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'zms-be/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'zms-be/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    # Docker is available on this runner, which the *IT suite needs:
    # Quarkus Dev Services starts Postgres through Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify
        working-directory: zms-be/animal-service
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            zms-be/animal-service/target/surefire-reports/
            zms-be/animal-service/target/failsafe-reports/
          if-no-files-found: ignore
